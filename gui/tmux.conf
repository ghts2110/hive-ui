# Somente o terminal integrado: a navegação é feita pelos controles gráficos.
set -g destroy-unattached off
set -g status off
set -g prefix None
set -g prefix2 None
unbind C-b
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g window-size latest
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# As interrupções também atualizam o status e calam a leitura em voz alta.
bind -n Escape { if -F '#{||:#{==:#{@status},trabalhando},#{==:#{@status},esperando}}' { set -p @status pronto ; set -pF @desde '#{client_activity}' } ; if -F '#{@fala}' { run-shell -b 'kill #{@fala}' } ; send-keys Escape }
bind -n C-c { if -F '#{||:#{==:#{@status},trabalhando},#{==:#{@status},esperando}}' { set -p @status pronto ; set -pF @desde '#{client_activity}' } ; if -F '#{@fala}' { run-shell -b 'kill #{@fala}' } ; send-keys C-c }
